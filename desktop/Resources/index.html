<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'">
  <title>Helios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window-frame">
    <header class="titlebar">
      <div class="titlebar-center"><strong>HELIOS</strong><i>/</i><span>AGENT CONSOLE</span></div>
      <button id="palette-button" class="key-button" aria-label="Open command palette">⌘ <b>K</b></button>
      <div id="health" class="health"><span class="status-dot pulse"></span><span>CONNECTING</span></div>
    </header>
    <div class="workspace">
      <nav id="nav" aria-label="Helios sections">
        <div class="nav-identity"><b>HELIOS · LOCAL</b><span id="nav-host">STARTING…</span></div>
        <div id="nav-items"></div>
        <div class="nav-footer">© 2026 SCRIPTSPACE</div>
      </nav>
      <main id="main"><div class="connection-card"><div class="spinner"></div><h1>&gt; CONNECTING</h1><p>OPENING THE PRIVATE LOCAL HELIOS BRIDGE…</p></div></main>
    </div>
  </div>
  <div id="approval" class="overlay hidden"></div>
  <div id="palette" class="overlay palette-overlay hidden"></div>
  <script src="app.js"></script>
</body>
</html>
